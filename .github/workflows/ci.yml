name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Production deploys queue and are never interrupted.
# A new commit on a pull request cancels that pull request's stale run.
concurrency:
  group: ${{ github.event_name == 'push' && 'deploy-production' || format('preview-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, test, lint, 'lint:fsd']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.check }}

  deploy:
    name: deploy (${{ github.event_name == 'push' && 'production' || 'preview' }})
    needs: checks
    # Fork pull requests get no secrets; skip the deploy instead of failing it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_GREEN_API_URL: ${{ vars.VITE_GREEN_API_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          DEPLOY_BRANCH: ${{ github.event_name == 'push' && 'main' || github.head_ref }}
          DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPLOY_MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: |
          npm run deploy -- \
            --branch "$DEPLOY_BRANCH" \
            --commit-hash "$DEPLOY_SHA" \
            --commit-message "$DEPLOY_MESSAGE"
